# ─────────────────────────────────────────────────────────────
# CKDO AI Chat Portal — Open WebUI + OpenRouter
# Jalankan:   docker compose up -d
# Update:     docker compose pull && docker compose up -d
# Logs:       docker compose logs -f --tail=50
#
# PERINGATAN: berkas ini SENDIRI tidak lengkap, dan perintah di atas hanya
# benar karena .env menyetel COMPOSE_FILE (lihat .env.example). Override per
# lingkungan memuat bundel CA sertifikat dashboard, volume konfigurasi SearXNG,
# dan dns/extra_hosts di dev.
#
# Menjalankan HANYA berkas ini akan start dengan rapi, lalu gagal diam-diam:
# login SSO membalas 500 untuk SEMUA pengguna, dengan pesan "internal error"
# yang tidak menyebut sertifikat sama sekali, dan web search mati. Itu benar-
# benar terjadi 2026-10-01 di kedua instance. Jadi JANGAN pernah memanggil
# `-f docker-compose.yml` sendirian, dan jangan menghapus COMPOSE_FILE dari
# .env dengan alasan merapikan.
# ─────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: ckdo-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ckdo-chat-net

  open-webui:
    # PENTING: jangan pakai tag ":main" untuk produksi — cek tag versi stabil terbaru di
    # https://github.com/open-webui/open-webui/pkgs/container/open-webui lalu pin di sini.
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: ckdo-chat-webui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      tika:
        condition: service_started
    ports:
      - "3010:8080"
    environment:
      # ── Database: Postgres (bukan SQLite bawaan) — wajib untuk multi-user ──
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      # ── Identitas aplikasi ──
      WEBUI_NAME: "CoChat"
      WEBUI_URL: ${WEBUI_URL}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}

      # ── Governance: peran default untuk user baru ──
      #
      # PERHATIAN: ini PersistentConfig. Nilainya hanya dibaca saat database
      # masih kosong; setelah itu yang menentukan adalah baris
      # `ui.default_user_role` di tabel config. Berkas ini pernah menulis
      # "pending" selama berbulan-bulan sementara database berisi "admin" —
      # akibatnya setiap orang yang login lewat SSO langsung menjadi
      # administrator, dan tidak ada yang menyadarinya karena compose terlihat
      # benar. Ubah lewat Admin Panel atau SQL, jangan lewat berkas ini saja.
      #
      # "user" dipilih (2026-09-30) supaya login pertama langsung bisa dipakai
      # tanpa menunggu approval, tanpa memberi hak admin. hostedDomain di
      # identity provider Google sudah membatasi pendaftaran ke akun
      # @ckd-otto.com, jadi yang bisa masuk hanya karyawan.
      DEFAULT_USER_ROLE: "user"

      # ── Bootstrap admin pertama (otomatis menonaktifkan signup lokal setelah dibuat) ──
      # Hanya berlaku sekali saat database masih kosong. Setelah admin ini terbentuk,
      # ENABLE_SIGNUP otomatis jadi false dengan sendirinya — tidak perlu diset manual.
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD}

      # ── SSO via Keycloak (realm "ckdo" yang sudah ada, client baru "ckdo-openwebui") ──
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
      OAUTH_PROVIDER_NAME: "CKDO SSO"
      OPENID_PROVIDER_URL: ${KEYCLOAK_OIDC_DISCOVERY_URL}
      OAUTH_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      OAUTH_SCOPES: "openid email profile"
      # Semua login lewat SSO — form email/password lokal disembunyikan supaya
      # hanya ada satu tombol, dan Keycloak melempar langsung ke Google
      # (identity-provider-redirector dengan defaultProvider=google).
      #
      # Konsekuensi yang harus disadari: kalau SSO rusak, TIDAK ADA yang bisa
      # masuk lewat antarmuka, termasuk admin. Jalan keluarnya lewat database:
      #   UPDATE config SET value = 'true' WHERE key = 'ui.enable_login_form';
      # lalu restart container. Juga PersistentConfig, jadi mengubah baris di
      # bawah saja tidak cukup pada instance yang sudah berjalan.
      ENABLE_LOGIN_FORM: "false"

      # ── Koneksi model via OpenRouter (endpoint OpenAI-compatible) ──
      OPENAI_API_BASE_URLS: "https://openrouter.ai/api/v1"
      OPENAI_API_KEYS: ${OPENROUTER_API_KEY}

      # ── RAG: pakai embedding dari Ollama di AI server (VM101), bukan lokal — hemat RAM ──
      RAG_EMBEDDING_ENGINE: "ollama"
      RAG_OLLAMA_BASE_URL: ${OLLAMA_SERVER_URL}
      RAG_EMBEDDING_MODEL: "bge-m3"
      OLLAMA_BASE_URLS: ${OLLAMA_SERVER_URL}

      # ── Ekstraksi dokumen: Tika (lebih andal untuk PDF hasil scan) ──
      CONTENT_EXTRACTION_ENGINE: "tika"
      TIKA_SERVER_URL: "http://tika:9998"
      TIKA_SERVER_VERSION: "4"

      # ── Matikan fitur berat yang tidak diperlukan, hemat resource di server 4GB ──
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      # Catatan: variabel ini PersistentConfig — nilainya hanya dipakai saat
      # database masih kosong. Setelah itu yang menentukan adalah tabel
      # `config` (kunci web.search.*), diubah lewat Admin Panel atau SQL.
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
      ENABLE_API_KEYS: "true"

      AIOHTTP_CLIENT_TIMEOUT: "300"

    volumes:
      - openwebui_data:/app/backend/data
    mem_limit: 1.5g
    networks:
      - ckdo-chat-net

  # ─────────────────────────────────────────────────────────────
  # SearXNG — mesin web search untuk Open WebUI.
  # Sengaja tanpa "ports": hanya dijangkau dari dalam ckdo-chat-net,
  # supaya tidak menjadi open search proxy di jaringan kantor.
  # DuckDuckGo (mesin default Open WebUI) tidak bisa dipakai di sini —
  # DNS-nya dibajak ke internetpositif3.firstmedia.com dan koneksinya gagal,
  # jadi SearXNG mengumpulkan hasil dari mesin lain. Lihat searxng/settings.yml.
  # ─────────────────────────────────────────────────────────────
  #
  # Berkas ini TIDAK lengkap dengan sendirinya: volume konfigurasi SearXNG
  # sengaja tidak ada di sini, karena dev dan prod memasangnya dari lokasi
  # yang berbeda (lihat docker-compose.dev.yml / docker-compose.prod.yml).
  # Selalu jalankan dengan salah satu override:
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
  searxng:
    image: searxng/searxng:latest
    container_name: ckdo-chat-searxng
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
    mem_limit: 512m
    networks:
      - ckdo-chat-net

  tika:
    image: apache/tika:latest-full
    container_name: ckdo-chat-tika
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - ckdo-chat-net

volumes:
  postgres_data:
  openwebui_data:

networks:
  ckdo-chat-net:
    driver: bridge
